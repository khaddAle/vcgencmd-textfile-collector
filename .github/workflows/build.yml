name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 never runs; it exists so the cluster's Trivy (amd64-only) can scan the image.
          platforms: linux/arm64,linux/amd64
          push: true
          # Run number stops a manual rebuild of the same commit from overwriting a deployed tag.
          tags: |
            ghcr.io/khaddale/vcgencmd-textfile-collector:latest
            ghcr.io/khaddale/vcgencmd-textfile-collector:${{ github.sha }}-${{ github.run_number }}
